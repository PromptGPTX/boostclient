<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="boostGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ffff"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Circle -->
  <circle cx="200" cy="200" r="180" fill="#0f172a" stroke="url(#accentGrad)" stroke-width="4"/>

  <!-- Inner Glow Ring -->
  <circle cx="200" cy="200" r="160" fill="none" stroke="url(#boostGrad)" stroke-width="2" opacity="0.3"/>

  <!-- Lightning Bolt Core -->
  <g transform="translate(200 200)" filter="url(#glow)">
    <path d="M -60 -100 L -20 -20 L 0 -30 L 40 50 L 20 60 L 80 0 L 20 -40 L 40 -50 Z" fill="url(#accentGrad)"/>
    <path d="M -50 -80 L 50 60 L 30 70 L -70 10 L -50 20 Z" fill="#ffffff" opacity="0.4"/>
  </g>

  <!-- Orbit Rings -->
  <circle cx="200" cy="200" r="130" fill="none" stroke="#2563eb" stroke-width="1" opacity="0.2" stroke-dasharray="4 4"/>
  <circle cx="200" cy="200" r="145" fill="none" stroke="#7c3aed" stroke-width="1" opacity="0.15" stroke-dasharray="2 6"/>

  <!-- Boost Text -->
  <text x="200" y="260" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="48" font-weight="900" fill="url(#accentGrad)" letter-spacing="2">BOOSTX</text>

  <!-- Tagline -->
  <text x="200" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#94a3b8" letter-spacing="1">10X PERFORMANCE • ALL IN ONE</text>
</svg>
